[workspace]
members = ["karukan-engine", "android-native"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
repository = "https://github.com/togatoga/karukan"
homepage = "https://github.com/togatoga/karukan"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
toml = "1.0"
thiserror = "2"
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
